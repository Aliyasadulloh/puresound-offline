name: Build PureSound APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Initialize Android platform files
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Configure Android minSdk 24 and Permissions
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Patch minSdk to 24 in build.gradle or build.gradle.kts
          for gradle_path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(gradle_path):
                  with open(gradle_path, "r") as f:
                      content = f.read()
                  content = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", content)
                  content = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", content)
                  content = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 24", content)
                  with open(gradle_path, "w") as f:
                      f.write(content)
                  print(f"Patched {gradle_path}")

          # 2. Patch AndroidManifest.xml with required permissions
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  manifest = f.read()
              perms = '''    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
          '''
              if "android.permission.RECORD_AUDIO" not in manifest:
                  manifest = manifest.replace("<application", perms + "
    <application", 1)
                  with open(manifest_path, "w") as f:
                      f.write(manifest)
                  print("Patched AndroidManifest.xml")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload PureSound Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: PureSound-Offline-APK
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
