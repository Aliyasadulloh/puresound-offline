name: Build PureSound APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android platform files
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Force compileSdk 36 for App and ALL Plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/force_sdk.gradle
          gradle.beforeProject { proj ->
              proj.afterEvaluate {
                  def androidExt = proj.extensions.findByName("android")
                  if (androidExt != null) {
                      try {
                          androidExt.compileSdk = 36
                      } catch (Exception ignored) {
                          try {
                              androidExt.compileSdkVersion 36
                          } catch (Exception ignored2) {}
                      }
                  }
              }
          }
          EOF

      - name: Configure Android minSdk 24 and Permissions
        run: |
          python3 -c '
          import os, re
          for gp in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(gp):
                  s = open(gp).read()
                  s = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", s)
                  s = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", s)
                  s = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 24", s)
                  open(gp, "w").write(s)
          mp = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mp):
              m = open(mp).read()
              perms = [
                  "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>",
                  "    <uses-permission android:name=\"android.permission.INTERNET\"/>",
                  "    <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\"/>",
                  "    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>",
                  "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\"/>",
                  "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\"/>",
              ]
              if "RECORD_AUDIO" not in m:
                  m = m.replace("<application", chr(10).join(perms) + chr(10) + "    <application", 1)
                  open(mp, "w").write(m)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload PureSound Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: PureSound-Offline-APK
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
